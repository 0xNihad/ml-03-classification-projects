[project]
name = "ml-03-classification-projects"
version = "0.1.0"
description = "Chapter 03 exercises: Hands-On Machine Learning with Scikit-Learn and PyTorch"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nltk>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
